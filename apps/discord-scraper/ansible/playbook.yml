---
# ──────────────────────────────────────────────────────────────────────────
# discord-scraper app play.
#
#   ../../deploy.sh discord-scraper        (from the infra repo root)
#
# Scheduled scraper (systemd timer, 4×/day, Europe/Riga). Type=oneshot service
# runs `python -m src.main`, posts new/bumped/gone ss.com 2-stroke enduro
# listings (Husqvarna + KTM) to Discord, exits. No long-running process, no
# inbound ports, local SQLite.
#
# Build model: deploy.sh clones discord-scraper, runs build.sh (stages source
# into dist/), passes dist_dir. The venv is built on the VPS (host interpreter).
# Secrets from the environment: DISCORD_WEBHOOK_HUSQVARNA_FE, DISCORD_WEBHOOK_KTM_EXC
# (secrets/discord-scraper.env).
# ──────────────────────────────────────────────────────────────────────────

- name: discord-scraper
  hosts: vps
  become: true
  gather_facts: true
  vars:
    app_dir: /opt/discord-scraper
    app_user: discord-scraper
    discord_webhook_husqvarna_fe: "{{ lookup('env', 'DISCORD_WEBHOOK_HUSQVARNA_FE') }}"
    discord_webhook_ktm_exc: "{{ lookup('env', 'DISCORD_WEBHOOK_KTM_EXC') }}"

  pre_tasks:
    - name: Assert staged source was passed (dist_dir)
      ansible.builtin.assert:
        that:
          - dist_dir is defined
          - (dist_dir ~ '/requirements.txt') is file
        fail_msg: >-
          Staged source not found at {{ dist_dir | default('(unset)') }}.
          Run via ./deploy.sh discord-scraper.
      delegate_to: localhost
      become: false

    - name: Validate webhook secrets are filled in
      ansible.builtin.assert:
        that:
          - discord_webhook_husqvarna_fe | length > 20
          - "'PASTE' not in discord_webhook_husqvarna_fe"
          - "'/ID/TOKEN' not in discord_webhook_husqvarna_fe"
          - discord_webhook_ktm_exc | length > 20
          - "'PASTE' not in discord_webhook_ktm_exc"
          - "'/ID/TOKEN' not in discord_webhook_ktm_exc"
        fail_msg: "DISCORD_WEBHOOK_HUSQVARNA_FE / DISCORD_WEBHOOK_KTM_EXC missing/placeholder in secrets/discord-scraper.env."

  tasks:
    - name: Install system packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - rsync
          - sqlite3
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Set system timezone to Europe/Riga
      community.general.timezone:
        name: Europe/Riga

    - name: Ensure app user exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: true

    - name: Sync staged source
      ansible.posix.synchronize:
        src: "{{ dist_dir }}/"
        dest: "{{ app_dir }}/app/"
        delete: true
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=MANIFEST"

    - name: Ensure data directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/data"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    - name: Fix app directory ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Create venv
      become_user: "{{ app_user }}"
      ansible.builtin.command:
        cmd: python3 -m venv {{ app_dir }}/venv
        creates: "{{ app_dir }}/venv/bin/python"

    - name: Install Python dependencies
      become_user: "{{ app_user }}"
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/app/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"

    - name: Install env file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/app/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      no_log: true

    - name: Install systemd service
      ansible.builtin.template:
        src: discord-scraper.service.j2
        dest: /etc/systemd/system/discord-scraper.service
        mode: "0644"
      notify: reload systemd

    - name: Install systemd timer
      ansible.builtin.template:
        src: discord-scraper.timer.j2
        dest: /etc/systemd/system/discord-scraper.timer
        mode: "0644"
      notify: reload systemd

    - name: Enable and start timer
      ansible.builtin.systemd:
        name: discord-scraper.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Trigger an immediate scrape run
      ansible.builtin.systemd:
        name: discord-scraper.service
        state: restarted

    - name: Deploy summary
      ansible.builtin.debug:
        msg:
          - "discord-scraper deployed. Timer: 08:00 / 12:40 / 17:20 / 22:00 Europe/Riga."
          - "Logs: journalctl -u discord-scraper.service"

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
