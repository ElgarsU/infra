---
# ──────────────────────────────────────────────────────────────────────────
# KP app play — Next.js booking / client management app for a gym trainer.
#
#   ../../deploy.sh kp        (from the infra repo root)
#
# Mirrors the honda play (standalone Node server + its own SQLite, behind
# Caddy) with the Next.js differences: build output is .next/, the server is
# `next start` (needs node_modules + source config at runtime, so nothing is
# pruned after the build). The booking pages are public; the trainer area
# is behind the app's own password login.
#
# Why build on the host: kp uses better-sqlite3 (native .node binary). A
# Mac-built artifact won't load on Linux, so `npm ci` + `npm run build` run
# ON THE VPS. build.sh (in the kp repo) only STAGES clean source into dist/.
#
# No database backups yet (prototype) — add before real client data goes in.
#
# Depends on:
#   • base roles (common): Node 20, build-essential + python3
#   • base roles (caddy):  cloudflare.env + security_headers snippet + sites.d/
# Secrets from the environment (secrets/kp.env):
#   KP_TRAINER_PASSWORD
# ──────────────────────────────────────────────────────────────────────────

- name: KP
  hosts: vps
  become: true
  gather_facts: true
  vars:
    # ── Secrets (from the environment) ──────────────────────────────────
    kp_trainer_password: "{{ lookup('env', 'KP_TRAINER_PASSWORD') }}"

    kp_app_dir: /opt/kp
    kp_data_dir: /opt/kp/data
    kp_user: kp
    kp_internal_port: 3003

  pre_tasks:
    - name: Assert OS is Ubuntu 24.04 ARM64
      ansible.builtin.assert:
        that:
          - ansible_architecture == "aarch64"
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: "Pinned to Ubuntu 24.04 ARM64."

    - name: Assert staged source was passed (dist_dir)
      ansible.builtin.assert:
        that:
          - dist_dir is defined
          - (dist_dir ~ '/package.json') is file
        fail_msg: >-
          Staged source not found at {{ dist_dir | default('(unset)') }}.
          Run via ./deploy.sh kp (clones kp, runs build.sh, passes dist_dir).
      delegate_to: localhost
      become: false

    - name: Stat base-infra artifacts (Caddy snippet, cloudflare.env)
      ansible.builtin.stat:
        path: "{{ item }}"
      register: base_infra
      loop:
        - /etc/caddy/snippets/security.caddy
        - /etc/caddy/cloudflare.env

    - name: Assert base roles + Node have run
      ansible.builtin.assert:
        that:
          - base_infra.results[0].stat.exists
          - base_infra.results[1].stat.exists
        fail_msg: "Run ./setup.sh (or ansible/site.yml) first — needs Caddy base + Node 20."

    - name: Validate secrets are filled in
      ansible.builtin.assert:
        that:
          - kp_trainer_password | length > 0
          - "'PASTE' not in kp_trainer_password"
        fail_msg: >-
          Missing value. KP_TRAINER_PASSWORD comes from secrets/kp.env. Fill it in.

  tasks:
    # ════════════════════════════════════════════════════════════════════
    # [BOOTSTRAP] user, directories, config, systemd unit, Caddy site
    # ════════════════════════════════════════════════════════════════════

    - name: Create kp system user
      ansible.builtin.user:
        name: "{{ kp_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ kp_app_dir }}"
        create_home: false

    - name: Ensure /opt/kp directory tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kp_user }}"
        group: "{{ kp_user }}"
        mode: "0755"
      loop:
        - "{{ kp_app_dir }}"
        - "{{ kp_app_dir }}/app"
        - "{{ kp_app_dir }}/app/.next"
        - "{{ kp_data_dir }}"

    - name: Write /opt/kp/.env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ kp_app_dir }}/.env"
        owner: "{{ kp_user }}"
        group: "{{ kp_user }}"
        mode: "0600"
      no_log: true
      notify: restart kp

    - name: Install kp systemd unit
      ansible.builtin.template:
        src: kp.service.j2
        dest: /etc/systemd/system/kp.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon reload
        - restart kp

    - name: Enable kp service
      ansible.builtin.systemd:
        name: kp
        enabled: true
        daemon_reload: true

    - name: Render hyrox.elgars.eu Caddy site
      ansible.builtin.template:
        src: caddy.kp.j2
        dest: /etc/caddy/sites.d/hyrox.elgars.eu.caddy
        owner: root
        group: root
        mode: "0644"
      register: kp_site_change

    - name: Validate Caddy + reload (if site changed)
      when: kp_site_change.changed
      ansible.builtin.shell:
        cmd: |
          set -e
          set -a
          # shellcheck disable=SC1091
          source /etc/caddy/cloudflare.env
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          systemctl reload caddy
        executable: /bin/bash
      changed_when: true

    # ════════════════════════════════════════════════════════════════════
    # [DEPLOY] stage source → build on host → restart
    # ════════════════════════════════════════════════════════════════════

    # Source comes from the staged clone (dist_dir). --delete keeps the tree in
    # sync, but node_modules / .next / .npm-cache are EXCLUDED so they survive
    # for the next npm ci's offline cache and Next's incremental build cache.
    - name: Rsync staged source to server
      ansible.posix.synchronize:
        src: "{{ dist_dir }}/"
        dest: "{{ kp_app_dir }}/app/"
        delete: true
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.next"
          - "--exclude=.npm-cache"
          - "--exclude=.data"

    - name: Fix ownership on /opt/kp/app
      ansible.builtin.file:
        path: "{{ kp_app_dir }}/app"
        state: directory
        recurse: true
        owner: "{{ kp_user }}"
        group: "{{ kp_user }}"

    # kp user has create_home:false, so $HOME is unset when running as it.
    # npm needs a writable HOME — point it (and the cache) into the app dir.
    - name: npm ci (install + rebuild native bindings for this host)
      ansible.builtin.command:
        cmd: npm ci --prefer-offline --no-audit --fund=false
        chdir: "{{ kp_app_dir }}/app"
      become_user: "{{ kp_user }}"
      environment:
        HOME: "{{ kp_app_dir }}/app"
        npm_config_cache: "{{ kp_app_dir }}/app/.npm-cache"
      changed_when: true

    # DATABASE_PATH is set so the build never creates a stray .data/ in the app
    # dir. The service is running the previous build while this overwrites
    # .next/, so expect a few seconds of errors until the restart below.
    - name: npm run build
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ kp_app_dir }}/app"
      become_user: "{{ kp_user }}"
      environment:
        HOME: "{{ kp_app_dir }}/app"
        DATABASE_PATH: "{{ kp_data_dir }}/kp.sqlite"
        NEXT_TELEMETRY_DISABLED: "1"
      changed_when: true

    - name: Verify .next/BUILD_ID exists
      ansible.builtin.stat:
        path: "{{ kp_app_dir }}/app/.next/BUILD_ID"
      register: output_stat

    - name: Fail if build produced no output
      ansible.builtin.fail:
        msg: ".next/BUILD_ID not found after npm run build"
      when: not output_stat.stat.exists

    - name: Restart kp.service
      ansible.builtin.systemd:
        name: kp
        state: restarted
        daemon_reload: true

    - name: Pause briefly for service to come up
      ansible.builtin.pause:
        seconds: 3

    - name: Health check (HTTP 200 from /)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kp_internal_port }}/"
        status_code: 200
        return_content: false
      register: health
      retries: 6
      delay: 2
      until: health.status == 200

    - name: Deploy summary
      ansible.builtin.debug:
        msg: "Deployed. kp.service active. / → {{ health.status }}."

  handlers:
    - name: daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart kp
      ansible.builtin.systemd:
        name: kp
        state: restarted
      failed_when: false
